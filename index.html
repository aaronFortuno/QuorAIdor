<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QourAIdor - Play the classic Quoridor board game against AI, a friend, or watch AI vs AI. Features evolutionary AI training.">
    <meta name="theme-color" content="#1a1a2e">
    <meta property="og:title" content="QourAIdor">
    <meta property="og:description" content="Play Quoridor against AI with evolutionary-trained intelligence">
    <meta property="og:type" content="website">
    <title>QourAIdor</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231a1a2e'/%3E%3Ccircle cx='11' cy='11' r='5' fill='%234fc3f7'/%3E%3Ccircle cx='21' cy='21' r='5' fill='%23e94560'/%3E%3Crect x='15' y='5' width='2' height='10' rx='1' fill='%23eee' opacity='0.6'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div id="header-controls">
                <div id="lang-selector">
                    <button class="lang-btn" data-lang="ca">CA</button>
                    <button class="lang-btn" data-lang="es">ES</button>
                    <button class="lang-btn" data-lang="en">EN</button>
                </div>
                <button id="theme-toggle" aria-label="Toggle theme">
                    <span id="theme-icon">☀️</span>
                </button>
            </div>
            <h1>QourAIdor</h1>
            <p class="subtitle" data-i18n="subtitle">Quoridor contra IA</p>
        </header>

        <div id="menu-screen" class="screen active">
            <h2 data-i18n="newGame">Nova Partida</h2>
            <div class="option-group">
                <label data-i18n="selectMode">Mode de joc:</label>
                <div class="toggle-group">
                    <button class="toggle-btn selected" data-mode-select="vsAI" data-i18n="vsAI">vs IA</button>
                    <button class="toggle-btn" data-mode-select="hvh" data-i18n="hvh">vs Humà</button>
                    <button class="toggle-btn" data-mode-select="aiVsAi" data-i18n="watchAI">Veure IA vs IA</button>
                </div>
            </div>
            <div class="option-group" id="color-option">
                <label data-i18n="playAs">Juga com a:</label>
                <div class="toggle-group">
                    <button class="toggle-btn selected" data-color="1" data-i18n="player1Top">Jugador 1 (Dalt)</button>
                    <button class="toggle-btn" data-color="2" data-i18n="player2Bottom">Jugador 2 (Baix)</button>
                </div>
                <div id="direction-hint" class="direction-hint"></div>
            </div>
            <div class="option-group" id="difficulty-option">
                <label data-i18n="aiDifficulty">Dificultat IA:</label>
                <div class="toggle-group">
                    <button class="toggle-btn" data-depth="1" data-i18n="easy" title="Depth 1 — Instant moves">Fàcil</button>
                    <button class="toggle-btn selected" data-depth="2" data-i18n="medium" title="Depth 2 — Fast, good for learning">Mitjà</button>
                    <button class="toggle-btn" data-depth="3" data-i18n="hard" title="Depth 3 — Strong play, may take a moment">Difícil</button>
                    <button class="toggle-btn" data-depth="4" data-i18n="expert" title="Depth 4 — Very strong, slower moves">Expert</button>
                </div>
            </div>
            <button id="continue-btn" class="primary-btn hidden" data-i18n="continueGame">Continuar Partida</button>
            <button id="start-btn" class="primary-btn" data-i18n="startGame">Començar Partida</button>
            <div style="margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                <button id="how-to-play-btn" class="secondary-btn" data-i18n="howToPlay">Com jugar</button>
                <a href="training.html" class="secondary-btn" data-i18n="trainingArena" style="text-decoration:none; display:inline-block;">Training Arena</a>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div id="game-layout">
                <div id="left-panel">
                    <div id="eval-detail"></div>
                    <div id="info-section">
                        <div class="player-info" id="p1-info">
                            <span class="player-dot p1-dot"></span>
                            <span class="player-label">Jugador 1</span>
                            <span class="wall-count" id="p1-walls">10 murs</span>
                        </div>
                        <div class="player-info" id="p2-info">
                            <span class="player-dot p2-dot"></span>
                            <span class="player-label">Jugador 2 (IA)</span>
                            <span class="wall-count" id="p2-walls">10 murs</span>
                        </div>
                        <div id="turn-indicator" data-i18n="yourTurn">El teu torn</div>
                        <div id="action-mode">
                            <button class="mode-btn selected" data-mode="move" data-i18n="move">Moure</button>
                            <button class="mode-btn" data-mode="wall-h" data-i18n="wallH">Mur ─</button>
                            <button class="mode-btn" data-mode="wall-v" data-i18n="wallV">Mur │</button>
                        </div>
                    </div>
                </div>

                <div id="eval-bar-vertical">
                    <div id="eval-score">0.0</div>
                    <span class="eval-label eval-label-top">P2</span>
                    <div id="eval-bar">
                        <div id="eval-fill-p2"></div>
                        <div id="eval-fill-p1"></div>
                    </div>
                    <span class="eval-label eval-label-bottom">P1</span>
                </div>

                <div id="board-area">
                    <canvas id="board-canvas" role="img" aria-label="Quoridor game board" tabindex="0"></canvas>
                    <div id="game-announce" aria-live="polite" class="sr-only"></div>
                </div>

                <div id="right-panel">
                    <div class="panel-title" data-i18n="moveHistory">Historial de Moviments</div>
                    <div id="move-list"></div>
                    <div id="analysis-info">
                        <div class="panel-title" data-i18n="analysis">Anàlisi</div>
                        <div id="analysis-content">
                            <div id="best-move-hint"></div>
                            <div id="position-summary"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="game-buttons">
                <button id="undo-btn" class="secondary-btn" data-i18n="undo">Desfer</button>
                <button id="resign-btn" class="secondary-btn" data-i18n="resign">Rendir-se</button>
                <button id="paths-btn" class="secondary-btn" data-i18n="showPaths">Camins</button>
                <button id="new-game-btn" class="secondary-btn" data-i18n="newGame">Nova Partida</button>
                <button id="back-menu-btn" class="secondary-btn" data-i18n="menu">Menú</button>
            </div>
        </div>

        <div id="game-over-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
            <div class="modal-content">
                <h2 id="game-over-title"></h2>
                <p id="game-over-msg"></p>
                <div id="game-over-stats"></div>
                <button id="rematch-btn" class="primary-btn" data-i18n="rematch">Revenja</button>
                <button id="modal-menu-btn" class="secondary-btn" data-i18n="menu">Menú</button>
            </div>
        </div>

        <div id="confirm-exit-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-exit-title">
            <div class="modal-content">
                <h2 id="confirm-exit-title" data-i18n="confirmExitTitle">Game in progress</h2>
                <p data-i18n="confirmExitMsg">Do you want to leave the game?</p>
                <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
                    <button id="save-exit-btn" class="primary-btn" data-i18n="saveAndExit">Save & Exit</button>
                    <button id="discard-exit-btn" class="secondary-btn" data-i18n="discardAndExit">Discard & Exit</button>
                    <button id="cancel-exit-btn" class="secondary-btn" data-i18n="cancel">Cancel</button>
                </div>
            </div>
        </div>

        <div id="rules-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="rules-title">
            <div class="modal-content rules-content">
                <h2 id="rules-title" data-i18n="howToPlay">How to Play</h2>
                <div id="rules-body"></div>
                <button id="rules-close-btn" class="primary-btn" style="margin-top: 16px;" data-i18n="close">Close</button>
            </div>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script src="game.js"></script>
    <script src="ai.js"></script>
    <script src="renderer.js"></script>
    <script src="ui.js"></script>
</body>
</html>
